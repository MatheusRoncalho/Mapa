<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      lang="pt-BR">

<!--
    cadastrar.xhtml — View JSF 2.2 para cadastro de livros.
    Usa <style> dentro de <h:head> para CSS inline (compatível com JSF 2.2).
    O binding dos campos com o Bean é feito via Expression Language: #{livroBean.campo}
-->

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cadastrar Livro — Biblioteca UniCesumar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8; color: #333;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        header {
            background: #1a3a5c; color: white;
            padding: 18px 40px;
            display: flex; justify-content: space-between; align-items: center;
        }
        header h1 { font-size: 1.4rem; }
        header nav a {
            color: rgba(255,255,255,0.85); text-decoration: none;
            margin-left: 20px; font-size: 0.9rem;
        }
        header nav a:hover { color: white; text-decoration: underline; }
        main {
            flex: 1; display: flex;
            justify-content: center; align-items: flex-start;
            padding: 50px 20px;
        }
        .card-form {
            background: white; border-radius: 12px; padding: 40px;
            width: 100%; max-width: 560px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border-top: 4px solid #1a3a5c;
        }
        .card-form h2 { font-size: 1.3rem; color: #1a3a5c; margin-bottom: 28px; }
        .campo { margin-bottom: 20px; display: flex; flex-direction: column; gap: 6px; }
        .campo label { font-size: 0.85rem; font-weight: 700; color: #444; display: block; margin-bottom: 4px; }
        .campo label span.obrigatorio { color: #dc3545; margin-left: 2px; }
        .campo input {
            padding: 11px 14px; border: 1px solid #ccd;
            border-radius: 7px; font-size: 0.95rem; width: 100%;
            font-family: inherit;
        }
        .campo input:focus {
            outline: none; border-color: #1a3a5c;
            box-shadow: 0 0 0 3px rgba(26,58,92,0.12);
        }
        .campo .dica { font-size: 0.78rem; color: #888; margin-top: 2px; }
        .btn-cadastrar {
            background: #1a3a5c; color: white; border: none;
            padding: 13px; border-radius: 7px; font-size: 1rem;
            font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px;
            font-family: inherit;
        }
        .btn-cadastrar:hover { background: #0f2540; }
        .alerta {
            padding: 14px 16px; border-radius: 8px;
            margin-bottom: 24px; font-size: 0.92rem; font-weight: 500;
        }
        .alerta-sucesso { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .alerta-erro    { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        footer {
            background: #1a3a5c; color: rgba(255,255,255,0.7);
            text-align: center; padding: 14px; font-size: 0.8rem;
        }
    </style>
</h:head>

<h:body>

    <header>
        <h1>📚 Biblioteca UniCesumar — Cadastro</h1>
        <nav>
            <a href="#{facesContext.externalContext.requestContextPath}/index.jsp">🏠 Início</a>
            <a href="#{facesContext.externalContext.requestContextPath}/livros">📋 Listar Acervo</a>
        </nav>
    </header>

    <main>
        <div class="card-form">
            <h2>➕ Cadastrar Novo Livro</h2>

            <!--
                h:form — formulário gerenciado pelo JSF.
                Todos os campos dentro dele são controlados pelo ciclo de vida JSF.
            -->
            <h:form id="formCadastro">

                <!-- Mensagem de feedback vinda do LivroBean -->
                <h:panelGroup rendered="#{not empty livroBean.mensagem}">
                    <div class="alerta #{livroBean.sucesso ? 'alerta-sucesso' : 'alerta-erro'}">
                        <h:outputText value="#{livroBean.mensagem}"/>
                    </div>
                </h:panelGroup>

                <!-- Campo: Título -->
                <div class="campo">
                    <label for="formCadastro:titulo">
                        Título <span class="obrigatorio">*</span>
                    </label>
                    <!--
                        value="#{livroBean.titulo}" faz o binding bidirecional:
                        JSF lê o campo digitado e injeta em livroBean.titulo
                    -->
                    <h:inputText id="titulo"
                                 value="#{livroBean.titulo}"
                                 maxlength="200"
                                 styleClass="campo-input">
                        <f:validateLength minimum="2" maximum="200"/>
                    </h:inputText>
                    <span class="dica">Mínimo 2 caracteres.</span>
                </div>

                <!-- Campo: Autor -->
                <div class="campo">
                    <label for="formCadastro:autor">
                        Autor <span class="obrigatorio">*</span>
                    </label>
                    <h:inputText id="autor"
                                 value="#{livroBean.autor}"
                                 maxlength="150">
                        <f:validateLength minimum="2" maximum="150"/>
                    </h:inputText>
                </div>

                <!-- Campo: Ano de Publicação -->
                <div class="campo">
                    <label for="formCadastro:ano">
                        Ano de Publicação <span class="obrigatorio">*</span>
                    </label>
                    <h:inputText id="ano" value="#{livroBean.anoPublicacao}">
                        <!-- f:convertInteger converte texto → Integer automaticamente -->
                        <f:convertInteger/>
                        <f:validateLongRange minimum="1000" maximum="2100"/>
                    </h:inputText>
                    <span class="dica">Entre 1000 e 2100.</span>
                </div>

                <!-- Campo: ISBN -->
                <div class="campo">
                    <label for="formCadastro:isbn">
                        ISBN <span class="obrigatorio">*</span>
                    </label>
                    <h:inputText id="isbn"
                                 value="#{livroBean.isbn}"
                                 maxlength="17"/>
                    <span class="dica">ISBN-10 (10 dígitos) ou ISBN-13 (13 dígitos), sem hifens.</span>
                </div>

                <!-- Botão: chama livroBean.cadastrar() ao clicar -->
                <h:commandButton value="Cadastrar Livro"
                                 action="#{livroBean.cadastrar}"
                                 styleClass="btn-cadastrar"/>

            </h:form>
        </div>
    </main>

    <footer>&#169; 2025 Universidade Cesumar — Sistema de Biblioteca</footer>

</h:body>
</html>
